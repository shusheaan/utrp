[package]
name = "utrp"
version = "0.3.0"
edition = "2021"
default-run = "utrp"

[dependencies]
rand = "0.8"
rand_chacha = "0.3.1"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
anyhow = "1.0"
midir = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
