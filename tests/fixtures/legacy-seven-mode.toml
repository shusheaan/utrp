# Regression fixture only, not a user preset. Pins the previous audit scope.

[session]
seconds_per_chord = 10.0
speed_step = 1.0
min_seconds = 1.0
max_seconds = 60.0
automatic = true

[simulation]

keys = ["C", "Db", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"]

modes = ["ionian", "dorian", "phrygian", "lydian", "mixolydian", "aeolian", "locrian"]
progression = "modal_phrases"
cycle_chunk_size = 4
minor_dominant_probability = 0.0
seventh_probability = 0.5
modulation_probability = 0.2
minimum_phrases_in_key = 2
extensions = true
secondary_probability = 0.2
substitution_probability = 0.1
borrow_probability = 0.1
ambient = true
ambient_probability = 0.4

[guitar]
tuning = [40,45,50,55,59,64]
max_fret = 22
max_span = 4
regions = [[0,5], [4,9], [8,13], [12,17], [16,22]]
triad_strings = [[3,2,1], [4,3,2], [5,4,3], [6,5,4]]
seventh_strings = [[4,3,2,1], [5,4,3,2], [6,5,4,3], [6,4,3,2], [5,3,2,1]]
arpeggio_every = 5

[storage]
enabled = true

