title = "Beach House — Over and Over"
info = "Once Twice Melody · G / Em 待核 · 标准定弦实音移植，无 capo"
status = "和声研究初稿；原曲核心旋律待核，练习线不是原唱。"
structure = "Intro → Verse → Chorus → Post-Chorus → 长 Outro"
