audit_note = "Spytunes 支持本页简化材料；已视觉检查 Ottenberg PDF 全 5 页，其第 1 页第 10/18 小节包含不同 slash chord/延伸，Dbmaj7/F 与 Fm7 音集合不同。PDF 将第 18 小节称 Pre-Chorus、第 58 小节称 Bridge，与 Spytunes 段落命名不同；第 4 页第 82 小节 Em9 支持末段升半音。未听核原录音。"

