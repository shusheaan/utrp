# Installed as ~/.config/sway/utrp-plugin-windows.conf. Preserve click-to-focus.
# Place Bitwig on the music desktop regardless of which launcher starts it.
assign [class="^com\.bitwig\.BitwigStudio$"] workspace number 2
# Bitwig's editor wrappers have no WM_CLASS. Match their exact editor-title suffix.
# Float at map time, before tiling can feed a full-screen size back to the host.
# Apply the default once per new editor; later manual resizing remains possible.
for_window [shell="xwayland" window_type="normal" title="^.+ / Chord Lab$"] floating enable, resize set width 920 px height 703 px
# Import the new session socket before starting/restarting the bounded plugin policy.
exec_always sh -c 'systemctl --user import-environment SWAYSOCK && systemctl --user restart utrp-plugin-windows.service'
