# All paths are relative to the current user's home unless noted.
# Snapshots are private and intentionally outside Git.
backup_root = "storage/daw/Recovery"
required = [
  ".zshrc", # Includes the gral-managed bitwig/bw Library launch commands.
  ".clap", # Includes Beat Lab (internal recording, state-embedded PCM + Gate), Chord Lab 0.3.12 (Enter restores current chord rooted/default position; original fixed quartic speed score independent of Play timeout; computer G per-degree rootless/RL, v4 normal state with v1-v3 import; strict same-wrapper hidden InputOnly focus-proxy handoff; uniform game-only capsule controls and one-row wheel values; fixed relative-major capsule order/labels across both modes, no out-of-key left selection; rounded, inset gray game panel and Demo score awards; cold-start container/keyboard Focus handoff; fixed major-key chord capsules and full game chord context, attack-time Sustain receiver resync, gray Race panel, semantic harmony colors, G game, matching repo plugin_windows/layout.py, v4 normal state, startup Sustain/Focus, 20 frets) / Guitar Front End.
  ".BitwigStudio/prefs", ".BitwigStudio/view-settings", # Native Spark+Woo Combined Device, 128 samples; switch speakers on Master only, not Woo-only device; do not select System In + Out (SF-558 default mic); instrument/audio Auto-arm OFF.
  "Bitwig Studio", # UTRP Library 0.11: folder/empty-selection startup keyboard; no auto-arm; Keystation 1.1: folders and manual Arm.
  ".config/REAPER", ".config/Surge XT.settings",
  ".Surge XT", ".Surge Synth Team", ".config/SFZTools/sfizz",
  ".config/pipewire", ".config/sway/config", ".config/sway/utrp-plugin-windows.conf", # Workspace 2, Chord Lab map-time 920x703 floating rule, plugin layout startup.
  ".config/systemd/user/utrp-plugin-windows.service",
  ".local/share/applications/com.bitwig.BitwigStudio.desktop",
  ".local/share/applications/utrp-bitwig-library.desktop",
  ".local/share/applications/utrp-guitar-lab.desktop",
  ".local/bin/audio-eq-toggle", ".local/bin/audio-governor", ".local/bin/audio-output",
  ".local/bin/reaper"
]
optional = [".config/wireplumber", ".local/state/wireplumber", ".BitwigStudio/plugin-states",
            ".config/systemd/user/utrp-plugin-windows.service.d"] # Preserve existing session ExecCondition.
# Large redistributable/runtime assets: opt-in, not duplicated in every settings snapshot.
assets = [".BitwigStudio/installed-packages", "opt/bitwig-studio-6.1.4"]
system_assets = ["/usr/lib/clap", "/usr/lib/vst3", "/usr/share/surge-xt"]
# Already on persistent storage; these are inventoried, not copied into themselves.
# Library levels: audible -2 dB, buses/master 0 dB; raw detection stays silent.
persistent = ["storage/daw", "storage/daw/samples", "storage/daw/Library/Library.bwproject",
              "storage/daw/BeatLab", "storage/daw/Tools/BeatLab"]
