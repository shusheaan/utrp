# perform.py 的完整参数面。sim 段透传给 utrp-sim(与 TUI 共享的 Rust simulation 引擎),
# perform/ornament 段是表演层。复制改名即一个新"作曲会话"。

sim:
  key: F              # key/mode 限制整局调性池；删掉则使用默认候选池
  mode: aeolian       # ionian dorian phrygian lydian mixolydian aeolian locrian
  measures: 20        # 总时长 ~= measures * step_s(20 x 8s ~= 2.7 分钟)
  threshold: 4        # 最少停留段数；默认还须完成原闭环才能概率转调
  difficulty: piano   # piano | guitar：导出钢琴音高或真实吉他结构
  base: 48            # voicing 基准八度(MIDI,48 = C3 附近)
  seed: 42            # 和声层原生 ChaCha8 seed；无需 LD_PRELOAD，
                      # 同版本/配置/seed 可复现；null/删掉 = 随机 seed。
                      # 另:每次 sim 的原始 JSON 存 progressions/<name>-sim.json,
                      # `--replay` 直接回放(跨版本升级也稳)。

perform:
  step_s: 8.0                          # 每个导出事件的秒数；bridge 也占一个事件
  pad_patch: magdalene/M1b-ghostpad.fxp  # 厚 pad,流动朦胧;lib/surge 相对路径
  pad_vel: [66, 90]                    # 力度随机范围
  strum_s: [0.015, 0.06]               # 声部错开(humanize)
  overlap: [1.05, 1.30]                # 音符释放 = overlap * 槽长 -> 交叠糊边

ornament:
  enabled: true
  patch: endless/D2-dxep.fxp   # 点缀音色(电钢;换 pluck/bell 都行)
  steps_per_beat: 2            # 时钟分辨率,小节固定 4 拍
  euclid: [5, 16, 0]           # 欧几里得节奏 E(k, n) + 旋转:16 步里均匀撒 5 个脉冲
  density: 0.75                # 每个脉冲实际触发的概率(< 1 = 呼吸感)
  pool: chord+9                # 音高池:chord | scale | chord+9(和弦音 + 九音)
  register: [72, 93]           # 点缀音区(C5..A6)
  turing:                      # 图灵机移位寄存器(Music Thing Turing Machine 思路)
    length: 8                  # 循环长度:8 步旋律反复
    mutate: 0.15               # 每步突变概率:0 = 永远循环,1 = 纯随机,中间 = 缓慢演化
  gate: 0.5                    # 音长 = gate * 步长
  vel: [38, 74]
  octave_leap: 0.08            # 偶发八度跳跃概率
  seed: 7                      # 点缀层 seed；与和声层 seed 独立，分别可复现

out:
  name: session                # 产物名:<name>.wav/.mid/.json
