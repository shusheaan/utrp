poll_seconds = 0.25 # Bound policy wait after discovery; unchanged routes are a no-op.
spark_output = "alsa_output.usb-Actions_Spark_GO_USB_ACTIONS-DEV-SN0-01.analog-stereo"
woo_output = "alsa_output.usb-XMOS_WooAudio-00.analog-stereo"
woo_eq = "eq_woo_in"
woo_backend = "eq_woo_out"
# JACK master outputs only; guitar capture is scoped separately below.
[jack_outputs]
"Bitwig Studio" = ["out1", "out2"]
"REAPER" = ["out1", "out2"]

# Persistent virtual input backend; no ownership of arbitrary Bitwig capture ports.
[guitar_input]
source = "alsa_input.usb-Actions_Spark_GO_USB_ACTIONS-DEV-SN0-01.mono-fallback"
source_port = "capture_MONO"
client = "utrp_guitar_capture"
destination_port = "input_MONO"

# Dedicated Beat Lab bus only: never redirect the guitar or other recording inputs.
[[microphone_inputs]]
source = "alsa_input.usb-MUSIC-BOOST_SF-558-00.mono-fallback"
source_port = "capture_MONO"
client = "Bitwig Studio"
destination_port = "beat lab mic L"

[[microphone_inputs]]
source = "alsa_input.usb-MUSIC-BOOST_SF-558-00.mono-fallback"
source_port = "capture_MONO"
client = "Bitwig Studio"
destination_port = "beat lab mic R"
