<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Portal · Music</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/soft-glow.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <nav class="source-tabs" aria-label="Music source"><button id="local" class="selected" aria-pressed="true">Local</button><button id="stream" aria-pressed="false">Stream</button></nav>
  </header>
  <main>
    <section id="local-page">
      <div class="heading" id="local-heading" hidden><button id="back" aria-label="Go back" hidden>←</button><h1 id="heading">Local music</h1><p id="subtitle">Loading library…</p></div>
      <form id="local-search" class="search" role="search"><input id="search" type="search" placeholder=" " autocomplete="off" enterkeyhint="search" aria-label="Search local artists, albums and tracks"><svg class="search-hint" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></form>
      <div id="local-scroll" class="list-scroll"><div id="list" class="list" aria-label="Music library"></div>
      <p id="empty" class="empty" hidden>No matches. Try another search.</p></div>
    </section>
    <section id="stream-page" hidden>
      <nav class="stream-tabs" aria-label="YouTube Music views">
        <button data-view="recommended" class="selected">Recommended</button><button data-view="liked">Liked</button><button data-view="playlists">Playlists</button><button data-view="search">Search</button>
      </nav>
      <div id="stream-toolbar">
      <form id="stream-search-form" class="search" role="search" hidden><input id="stream-search" type="search" maxlength="300" placeholder=" " autocomplete="off" enterkeyhint="search" aria-label="Search YouTube Music"><svg class="search-hint" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></form>
      <div class="stream-heading" id="stream-heading-row"><button id="stream-back" aria-label="Go back" hidden>←</button><h2 id="stream-heading">Recommended</h2><p id="stream-count" hidden></p><button id="stream-refresh" type="button" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 1 0 0 5M20 4v6h-6"/></svg></button></div>
      <nav id="stream-categories" class="search-categories" aria-label="Search result types" hidden>
        <button data-kind="track" class="selected" aria-pressed="true">Songs</button><button data-kind="artist" aria-pressed="false">Artists</button><button data-kind="album" aria-pressed="false">Albums</button><button data-kind="playlist" aria-pressed="false">Playlists</button>
      </nav>
      </div>
      <div id="stream-scroll" class="list-scroll"><p id="stream-message" role="status"></p><div id="stream-list" class="list"></div>
      <button id="stream-more" hidden>Load 100 more</button></div>
    </section>
  </main>
  <footer>
    <div id="notice" role="status" hidden></div>
    <div class="now"><span id="title">Choose a track</span><span id="artist" hidden></span><button id="like" type="button" hidden disabled aria-label="Loading rating" title="Loading rating"><svg viewBox="0 0 24 24" aria-hidden="true" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 21 3.8 13C-2 7.2 6 0 12 6.5 18 0 26 7.2 20.2 13Z"/></svg></button></div>
    <div class="progress"><span id="position">0:00</span><div class="seek-wrap"><input id="seek" type="range" min="0" max="0" value="0" step="1" aria-label="Playback position" disabled><span id="marker-a" class="ab-marker" hidden>A</span><span id="marker-b" class="ab-marker" hidden>B</span></div><span id="duration">0:00</span></div>
    <div class="transport">
      <button id="ab" type="button" aria-label="Set A" title="Set A" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><text id="ab-mode" x="12" y="13" text-anchor="middle" dominant-baseline="middle">A</text></svg></button>
      <button id="fade" type="button" aria-label="Fade off" aria-pressed="false" title="Fade off" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c4 0 4-12 9-12s5 12 9 12"/></svg></button>

      <button data-action="previous" aria-label="Previous track" title="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6 6 12 12 18"/><path d="M19 6 13 12 19 18"/></svg></button>
      <button data-action="backward" aria-label="Back five seconds" title="Back five seconds"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 9 12 15 18"/></svg></button>
      <button data-action="toggle" class="play" id="play" aria-label="Play" title="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
          <path id="play-icon" d="M9 5 18 12 9 19Z"/>
          <g id="pause-icon" hidden><rect x="7" y="5" width="3" height="14"/><rect x="14" y="5" width="3" height="14"/></g>
        </svg>
      </button>
      <button data-action="forward" aria-label="Forward five seconds" title="Forward five seconds"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 15 12 9 18"/></svg></button>
      <button data-action="next" aria-label="Next track" title="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6 11 12 5 18"/><path d="M12 6 18 12 12 18"/></svg></button>
      <button data-action="shuffle" id="shuffle" aria-label="Shuffle off" aria-pressed="false" title="Shuffle off">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h3c4 0 8 12 12 12h3M18 15l3 3-3 3M3 18h3c1.5 0 3-2 4-4M14 10c1-2 2.5-4 4-4h3M18 3l3 3-3 3"/></svg>
      </button>
      <button data-action="repeat" id="repeat" aria-label="Repeat one" title="Repeat one">
        <svg class="repeat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0 0 5M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text id="repeat-mode" x="12" y="13" text-anchor="middle" dominant-baseline="middle">1</text></svg>
      </button>

    </div>
  </footer>
</body>
</html>
